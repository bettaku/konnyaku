# Include inside nginx's http {} block. Supply your TLS certificate paths.
limit_req_zone $binary_remote_addr zone=konnyaku_login:10m rate=10r/m;
server {
    listen 80;
    server_name translate.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name translate.example.com;
    ssl_certificate /etc/letsencrypt/live/translate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/translate.example.com/privkey.pem;
    client_max_body_size 5m;
    proxy_read_timeout 240s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /api/login {
        limit_req zone=konnyaku_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
